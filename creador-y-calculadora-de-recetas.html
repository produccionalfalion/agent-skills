<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreadorYCalculadoraDeRecetas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: round;
        --shape-multiplier: 1;

          --background: #12141799;
        --foreground: #F1F3F5;
        --primary: #00c4a9;
        --primary-foreground: #022c1f;
        --secondary: #2A2F35;
        --secondary-foreground: #D1D5DB;
        --muted: #272A30;
        --muted-foreground: #9CA3AF;
        --accent: #f5d50b;
        --accent-foreground: #451A03;
        --destructive: #F43F5E;
        --card: #1A1D21;
        --card-foreground: #F1F3F5;
        --popover: #1A1D21;
        --popover-foreground: #F1F3F5;
        --border: #374151;
        --input: #272A30;
        --ring: #00C48C;
        --chart-1: #00C48C;
        --chart-2: #F59E0B;
        --chart-3: #F43F5E;
        --chart-4: #3B82F6;
        --chart-5: #8B5CF6;

        --font-sans: "Inter";
        --font-heading: "Inter";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1.5rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="flex flex-col min-h-screen bg-background text-foreground pb-20 font-sans">
      <header class="flex items-center justify-between p-4 border-b border-border bg-card">
        <div class="flex items-center gap-2">
          <iconify-icon icon="ph:flask-fill" class="text-xl text-primary"></iconify-icon>
          <h1 class="text-lg font-heading font-semibold tracking-tight uppercase">Nueva Receta</h1>
        </div>
        <button class="text-sm font-bold text-primary uppercase tracking-wider">Guardar</button>
      </header>
      <main class="flex-1 p-4 space-y-6 overflow-y-auto">
        <div class="space-y-4">
          <div>
            <label
              class="text-[10px] font-bold text-muted-foreground uppercase tracking-wider block mb-1"
              >Nombre del Producto</label
            ><input
              type="text"
              placeholder="Ej: Vela Aromática 250g"
              class="w-full bg-input border border-border rounded-sm p-3 text-sm focus:outline-none focus:ring-1 focus:ring-primary"
            />
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label
                class="text-[10px] font-bold text-muted-foreground uppercase tracking-wider block mb-1"
                >Tamaño del Lote</label
              >
              <div class="relative">
                <input
                  type="number"
                  value="10"
                  class="w-full bg-input border border-border rounded-sm p-3 text-sm focus:outline-none focus:ring-1 focus:ring-primary font-mono"
                /><span
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-muted-foreground"
                  >unidades</span
                >
              </div>
            </div>
            <div>
              <label
                class="text-[10px] font-bold text-muted-foreground uppercase tracking-wider block mb-1"
                >Rendimiento Estim.</label
              >
              <div class="relative">
                <input
                  type="text"
                  value="98"
                  class="w-full bg-input border border-border rounded-sm p-3 text-sm focus:outline-none focus:ring-1 focus:ring-primary font-mono"
                  disabled
                /><span
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-muted-foreground"
                  >%</span
                >
              </div>
            </div>
          </div>
        </div>
        <section>
          <h2
            class="text-xs font-bold text-muted-foreground uppercase tracking-wider mb-3 flex justify-between items-center"
          >
            <span>Insumos Requeridos</span
            ><button class="text-primary text-[10px] flex items-center gap-1">
              <iconify-icon icon="ph:plus-circle-bold"></iconify-icon> Añadir Insumo
            </button>
          </h2>
          <div class="space-y-3">
            <div class="bg-card border border-border rounded-sm p-3 space-y-3">
              <div class="flex justify-between items-start">
                <span class="text-xs font-bold uppercase tracking-tight">Cera de Soya Premium</span
                ><button class="text-muted-foreground hover:text-destructive">
                  <iconify-icon icon="ph:trash-bold"></iconify-icon>
                </button>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="text-[8px] font-bold text-muted-foreground uppercase mb-1 block"
                    >Cant. Neta</label
                  >
                  <div class="relative">
                    <input
                      type="number"
                      value="230"
                      class="w-full bg-input/50 border border-border rounded-sm p-2 text-xs font-mono"
                    /><span
                      class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-muted-foreground"
                      >g</span
                    >
                  </div>
                </div>
                <div>
                  <label class="text-[8px] font-bold text-accent uppercase mb-1 block"
                    >Merma (3.5%)</label
                  >
                  <div class="relative">
                    <input
                      type="text"
                      value="8.05"
                      class="w-full bg-accent/5 border border-accent/20 text-accent rounded-sm p-2 text-xs font-mono"
                      readonly
                    /><span
                      class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-accent/70"
                      >g</span
                    >
                  </div>
                </div>
              </div>
              <div class="pt-2 border-t border-border flex justify-between items-center">
                <span class="text-[9px] text-muted-foreground uppercase">Cant. Bruta Real</span
                ><span class="text-xs font-mono font-bold">238.05 g</span>
              </div>
            </div>
            <div class="bg-card border border-border rounded-sm p-3 space-y-3">
              <div class="flex justify-between items-start">
                <span class="text-xs font-bold uppercase tracking-tight">Frasco Vidrio 250ml</span
                ><button class="text-muted-foreground">
                  <iconify-icon icon="ph:trash-bold"></iconify-icon>
                </button>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="text-[8px] font-bold text-muted-foreground uppercase mb-1 block"
                    >Cant. Neta</label
                  >
                  <div class="relative">
                    <input
                      type="number"
                      value="1"
                      class="w-full bg-input/50 border border-border rounded-sm p-2 text-xs font-mono"
                    /><span
                      class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-muted-foreground"
                      >u</span
                    >
                  </div>
                </div>
                <div>
                  <label class="text-[8px] font-bold text-accent uppercase mb-1 block"
                    >Merma (0%)</label
                  >
                  <div class="relative">
                    <input
                      type="text"
                      value="0"
                      class="w-full bg-input/20 border border-border rounded-sm p-2 text-xs font-mono"
                      readonly
                    /><span
                      class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-muted-foreground"
                      >u</span
                    >
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
        <section class="bg-primary/5 border border-primary/20 rounded-sm p-4 space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <p class="text-[9px] text-muted-foreground uppercase font-bold mb-1">
                Costo Unitario (Bruto)
              </p>
              <p class="text-lg font-heading font-bold">$12.45</p>
            </div>
            <div>
              <label class="text-[9px] text-primary uppercase font-bold mb-1 block"
                >Margen Deseado (%)</label
              ><input
                type="number"
                value="60"
                class="w-full bg-primary/10 border border-primary/30 rounded-sm p-2 text-xs font-mono text-primary font-bold"
              />
            </div>
          </div>
          <div class="pt-3 border-t border-primary/20">
            <div class="flex justify-between items-end">
              <div>
                <p class="text-[9px] text-muted-foreground uppercase font-bold">Precio Sugerido</p>
                <p class="text-2xl font-heading font-bold text-primary">$31.12</p>
              </div>
              <div class="text-right">
                <p class="text-[9px] text-muted-foreground uppercase font-bold">Ganancia/Unidad</p>
                <p class="text-lg font-mono font-bold text-primary">+$18.67</p>
              </div>
            </div>
          </div>
        </section>
      </main>
      <nav
        class="fixed bottom-0 left-0 right-0 bg-card border-t border-border flex items-center justify-between pb-safe"
      >
        <button class="flex-1 flex flex-col items-center justify-center py-3 text-muted-foreground">
          <iconify-icon icon="ph:squares-four" class="text-xl mb-1"></iconify-icon
          ><span class="text-[10px] font-semibold">Inicio</span></button
        ><button
          class="flex-1 flex flex-col items-center justify-center py-3 text-muted-foreground"
        >
          <iconify-icon icon="ph:box-arrow-down" class="text-xl mb-1"></iconify-icon
          ><span class="text-[10px] font-semibold">Insumos</span></button
        ><button class="flex-1 flex flex-col items-center justify-center py-3 text-primary">
          <iconify-icon icon="ph:flask-fill" class="text-xl mb-1"></iconify-icon
          ><span class="text-[10px] font-semibold">Recetas</span></button
        ><button
          class="flex-1 flex flex-col items-center justify-center py-3 text-muted-foreground"
        >
          <iconify-icon icon="ph:factory" class="text-xl mb-1"></iconify-icon
          ><span class="text-[10px] font-semibold">Producción</span>
        </button>
      </nav>
    </div>
  </body>
</html>
